<h2 mat-dialog-title>Seleccionar entidad financiera</h2>

<mat-dialog-content>
  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Buscar entidad</mat-label>
    <mat-icon matPrefix>search</mat-icon>
    <input matInput [(ngModel)]="searchText" placeholder="Nombre o código" />
  </mat-form-field>

  <div class="entidad-list">
    @for (entidad of entidadesFiltradas; track entidad.idEntidad) {
      <button type="button" class="entidad-option" (click)="seleccionar(entidad)">
        <span class="entidad-icon"><mat-icon>account_balance</mat-icon></span>
        <span class="entidad-info">
          <strong>{{ entidad.denominacion }}</strong>
          <small>{{ entidad.codigoEntidad }}</small>
        </span>
        <mat-icon>chevron_right</mat-icon>
      </button>
    } @empty {
      <p class="empty-state">No se encontraron entidades activas</p>
    }
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cerrar()">Cancelar</button>
</mat-dialog-actions>
