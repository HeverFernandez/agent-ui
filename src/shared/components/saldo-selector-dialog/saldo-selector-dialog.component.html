<h2 mat-dialog-title>Seleccionar entidad financiera</h2>

<mat-dialog-content>
  <mat-form-field appearance="fill" class="search-field">
    <mat-label>Buscar entidad</mat-label>
    <mat-icon matPrefix>search</mat-icon>
    <input
      matInput
      type="text"
      id="floating_standard_2"
      #txtSearch
      (keyup.enter)="valueSearch.set(txtSearch.value)"
      (keyup)="inputValue.set(txtSearch.value)"
      [value]="inputValue()"
      placeholder="Nombre o código..."
    />
    <mat-icon matSuffix (click)="cleanData()">close</mat-icon>
  </mat-form-field>
  @if (saldos() && saldos()!.length > 0) {
    <div class="entidad-list">
      @for (entidad of saldos(); track entidad.id) {
        <button
          type="button"
          class="entidad-option"
          (click)="seleccionar(entidad)"
        >
          <span class="entidad-icon"><mat-icon>account_balance</mat-icon></span>
          <span class="entidad-info">
            <strong>{{ entidad.entidad }}</strong>
            <small>Monto Disponible {{ entidad.montoDisponible }}</small>
          </span>
          <mat-icon>chevron_right</mat-icon>
        </button>
      } @empty {
        <p class="empty-state">No se encontraron entidades activas</p>
      }
    </div>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cerrar()">Cancelar</button>
</mat-dialog-actions>
